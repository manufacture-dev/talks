<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Manufacture Anamorphose</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <style>
    :root {
      --fg: rgba(255, 255, 255, 0.9);
      --dim: rgba(255, 255, 255, 0.46);
      --faint: rgba(255, 255, 255, 0.16);
      --signal: #ff5a1f;
      --bg: #08090c;
      color-scheme: dark;
    }
    body.light {
      --fg: rgba(12, 12, 14, 0.9);
      --dim: rgba(12, 12, 14, 0.5);
      --faint: rgba(12, 12, 14, 0.16);
      --bg: #ebe8e2;
      color-scheme: light;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 400 11px/1.5 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      -webkit-font-smoothing: antialiased;
      transition: color 0.6s ease;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    body.grabbing #stage { cursor: grabbing; }

    .hud { position: fixed; z-index: 10; pointer-events: none; user-select: none; }
    .tl { top: calc(24px + env(safe-area-inset-top, 0px)); left: calc(28px + env(safe-area-inset-left, 0px)); }
    .tr { top: calc(24px + env(safe-area-inset-top, 0px)); right: calc(28px + env(safe-area-inset-right, 0px)); text-align: right; }
    .bl { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: calc(28px + env(safe-area-inset-left, 0px)); }
    .br { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); right: calc(28px + env(safe-area-inset-right, 0px)); text-align: right; }

    .title { font-weight: 500; font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; }
    .sub { color: var(--dim); text-transform: uppercase; letter-spacing: 0.22em; font-size: 10px; margin-top: 4px; }

    .state { display: inline-flex; align-items: center; gap: 9px; text-transform: uppercase; letter-spacing: 0.22em; font-size: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--signal); transition: background 0.3s; }
    body.locked .dot { background: var(--signal); box-shadow: 0 0 10px var(--signal); }
    .align { margin-top: 6px; font-size: 22px; font-weight: 400; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
    .align small { font-size: 11px; color: var(--dim); margin-left: 4px; }

    .meters[hidden] { display: none; }
    .meters { margin-top: 10px; display: grid; gap: 5px; justify-items: end; }
    .meter { display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.2em; font-size: 9.5px; color: var(--dim); --p: 0; }
    .meter i { width: 72px; height: 2px; background: var(--faint); position: relative; overflow: hidden; }
    .meter i::after { content: ""; position: absolute; inset: 0; background: var(--signal); transform-origin: left; transform: scaleX(var(--p)); }
    .catalog { display: grid; gap: 7px; margin-top: 16px; max-width: min(620px, 58vw); }
    .forms { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
    .forms button span { margin-left: 6px; color: var(--dim); }
    .versions button { border-style: dashed; }
    .note { color: var(--dim); font-size: 10px; letter-spacing: 0.06em; }
    .forms button { padding: 7px 10px; font-size: 9.5px; }
    .forms button[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); }
    dl { display: grid; grid-template-columns: auto auto; gap: 3px 18px; }
    dt { color: var(--dim); text-transform: uppercase; letter-spacing: 0.2em; font-size: 9.5px; padding-top: 1px; }
    dd { text-transform: uppercase; letter-spacing: 0.12em; }
    #seed { color: var(--signal); }

    .buttons { display: flex; gap: 8px; justify-content: flex-end; pointer-events: auto; }
    button {
      font: inherit; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--fg); background: transparent; border: 1px solid var(--faint);
      padding: 9px 14px; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    }
    button:hover { border-color: var(--fg); }
    button:focus-visible { outline: 1px solid var(--signal); outline-offset: 2px; }
    button kbd { font: inherit; color: var(--dim); margin-left: 6px; }
    .hint { color: var(--dim); text-transform: uppercase; letter-spacing: 0.2em; font-size: 9.5px; margin-bottom: 12px; }


    body.clean .hud { display: none; }
    #eyelabel {
      position: fixed; left: 0; top: 0; z-index: 6; pointer-events: none; opacity: 0;
      font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--signal); white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
    @media (max-width: 640px) {
      .tl { top: 16px; left: 16px; } .tr { top: 16px; right: 16px; }
      .bl { bottom: 70px; left: 16px; right: 16px; }
      .tl { right: 16px; }
      .catalog { max-width: none; margin-top: 64px; }
      .note { display: none; }
      dl { display: none; } .br { bottom: 16px; right: 16px; left: 16px; }
      .hint { display: none; }
      .buttons { justify-content: stretch; } .buttons button { flex: 1; padding: 10px 6px; }
      button kbd { display: none; }
      .align { font-size: 18px; }
      dl { font-size: 10px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <canvas id="stage" aria-label="Logo Manufacture en sculpture anamorphique 3D"></canvas>
  <div id="eyelabel">◉ Point de vue E</div>

  <div class="hud tl">
    <div class="title">Manufacture</div>
    <div class="sub">Logo génératif · essais</div>
    <div class="catalog">
      <div class="forms" id="themes" role="group" aria-label="Thème"></div>
      <div class="forms versions" id="versions" role="group" aria-label="Version"></div>
      <div class="note" id="theme-note"></div>
    </div>
  </div>

  <div class="hud tr">
    <div class="state"><span class="dot"></span><span id="lockstate">—</span></div>
    <div class="align"><span id="align">—</span><small>% alignement</small></div>
    <div class="meters" id="meters">
      <div class="meter" id="m-logo"><span>Logo</span><i></i></div>
      <div class="meter" id="m-ai"><span>AI</span><i></i></div>
    </div>
  </div>

  <div class="hud bl">
    <dl>
      <dt>Seed</dt><dd id="seed">—</dd>
      <dt>Fabrication</dt><dd id="field">—</dd>
      <dt>Finition</dt><dd id="finish">—</dd>
      <dt>Profil</dt><dd id="profile">—</dd>
      <dt>Pièces</dt><dd id="count">—</dd>
    </dl>
  </div>

  <div class="hud br">
    <div class="hint">Glisser pour tourner · Molette pour zoomer</div>
    <div class="buttons">
      <button id="ai">AI<kbd>A</kbd></button>
      <button id="regen">Régénérer<kbd>R</kbd></button>
      <button id="pause">Pause</button>
      <button id="save" hidden>PNG</button>
    </div>
  </div>
